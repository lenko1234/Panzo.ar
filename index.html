        // Helper para optimización automática a WebP y compresión inteligente en CDN de Sanity
        function optimizeSanityImage(url, width = 1200, quality = 85) {
            if (!url || typeof url !== 'string') return url;
            if (url.includes('cdn.sanity.io')) {
                const optimizedUrl = new URL(url);
                optimizedUrl.searchParams.set('auto', 'format');
                optimizedUrl.searchParams.set('w', width);
                optimizedUrl.searchParams.set('q', quality);
                return optimizedUrl.toString();
            }
            return url;
        }

        function buildSanitySrcSet(url, widths = [360, 600, 800, 1000]) {
            if (!url || !url.includes('cdn.sanity.io')) return '';
            return widths.map(width => `${optimizeSanityImage(url, width, 85)} ${width}w`).join(', ');
        }

        // --- FETCH DYNAMIC MENU FROM SANITY.IO ---
        async function fetchMenuFromSanity() {
            const PROJECT_ID = 'zq23sglj';
            const DATASET = 'production';
            const QUERY = encodeURIComponent(`{
                "hamburguesas": *[_type == "burger"] | order(order asc) {
                    id,
                    name,
                    ingredients,
                    hasBackground,
                    "image": image.asset->url,
                    variants[] {
                        type,
                        price
                    }
                },
                "bebidas": *[_type == "bebida"] | order(order asc) {
                    id,
                    name,
                    description,
                    "image": image.asset->url,
                    price,
                    icon
                }
            }`);
            const url = `https://${PROJECT_ID}.apicdn.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500);
                let response;
                try {
                    response = await fetch(url, { signal: controller.signal });
                } finally {
                    clearTimeout(timeoutId);
                }
                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                const result = await response.json();

                if (result.result) {
                    // Usamos los datos de Sanity tal cual — aunque estén vacíos.
                    // El backup solo se activa si Sanity no responde (catch).
                    const rawBurgers = result.result.hamburguesas ?? hamburguesasBackup;
                    hamburguesas = rawBurgers.map(b => ({
                        ...b,
                        image: optimizeSanityImage(b.image, 1000, 85),
                        bgImage: optimizeSanityImage(b.bgImage, 1200, 85)
                    }));

                    // Previsualización local de la nueva imagen de La Traición (solo foto original encuadrada)
                    const traicion = hamburguesas.find(b => b.name && (b.name.toUpperCase().includes('TRAICION') || b.name.toUpperCase().includes('TRAICIÓN')));
                    if (traicion) {
                        traicion.bgImage = "assets/new design/traicion.webp";
                        traicion.image = "";
                        traicion.hasBackground = true;
                    }

                    const rawBebidas = result.result.bebidas ?? bebidasBackup;
                    bebidas = rawBebidas.map(b => ({
                        ...b,
                        image: optimizeSanityImage(b.image, 800, 85)
                    }));

                    console.log(`Menú cargado desde Sanity: ${hamburguesas.length} burgers, ${bebidas.length} bebidas.`);
                } else {
                    throw new Error("No se devolvieron resultados");
                }
            } catch (error) {
                // Solo llega acá si hubo error de red o Sanity está caído
                console.error("Error al conectar con Sanity. Usando base de datos local de respaldo:", error);
                hamburguesas = hamburguesasBackup;
                bebidas = bebidasBackup;
            }
        }

        // La consulta comienza apenas el parser llega al script. DOMContentLoaded reutiliza
        // esta promesa en lugar de recién iniciar la red en ese momento.
        const menuRequest = fetchMenuFromSanity();

        // --- Función para formatear precio (Movida arriba para disponibilidad global) ---
        function formatPrice(price) {
            return price.toLocaleString('es-AR');
        }

        // Un objeto global para guardar la variante seleccionada de cada burger
        window.selectedBurgerVariants = window.selectedBurgerVariants || {};

        // --- Renderizar Hamburguesas ---
        function renderHamburguesas() {
            console.log('Iniciando render de hamburguesas...');
            const grid = document.getElementById('hamburguesas-grid');
            const placeholder = document.getElementById('hamburguesas-placeholder');
            const fragment = document.createDocumentFragment();

            if (hamburguesas.length === 0) {
                grid.replaceChildren();
                grid.classList.remove('is-loading');
                grid.setAttribute('aria-busy', 'false');
                placeholder.style.display = 'block';
                return;
            }
            placeholder.style.display = 'none';

            hamburguesas.forEach((hamburguesa, index) => {
                // Inicializar variante por defecto si no existe
                if (window.selectedBurgerVariants[hamburguesa.id] === undefined) {
                    window.selectedBurgerVariants[hamburguesa.id] = 0;
                }

                const card = document.createElement('div');
                card.className = 'nd-card fade-in-up';
                card.style.transitionDelay = `${Math.min(index * 60, 240)}ms`;

                // Limpiar ingredientes: buscar números y envolverlos en Archivo Black para legibilidad
                const readableIngredients = hamburguesa.ingredients ? hamburguesa.ingredients.replace(/(\d+)/g, '<span style="font-family: \'Archivo Black\', sans-serif; font-size: 1.1em; letter-spacing: 0;">$1</span>') : '';

                const isFramed = hamburguesa.hasBackground !== false && Boolean(hamburguesa.image || hamburguesa.bgImage);
                const bgSrc = hamburguesa.bgImage || (isFramed ? hamburguesa.image : null);
                const stickerSrc = !isFramed ? hamburguesa.image : null;
                const hasIngredients = Boolean(hamburguesa.ingredients && hamburguesa.ingredients.trim() !== '');
                const isCombo = Boolean(hamburguesa.name && (hamburguesa.name.toUpperCase().includes('COMBO CLÁSICA') || hamburguesa.name.toUpperCase().includes('COMBO CLASICA')) || hamburguesa.id === 108);
                const imageLoading = index < 2 ? 'eager' : 'lazy';
                const imagePriority = index === 0 ? ' fetchpriority="high"' : '';
                const bgSrcSet = buildSanitySrcSet(bgSrc);
                const stickerSrcSet = buildSanitySrcSet(stickerSrc);
                const imageSizes = isCombo
                    ? '(max-width: 800px) 700px, (max-width: 1400px) 60vw, 900px'
                    : '(max-width: 800px) calc(100vw - 40px), (max-width: 1400px) calc(50vw - 60px), 660px';

                card.innerHTML = `
                    <div class="nd-card-inner ${hasIngredients ? '' : 'no-ingredients'} ${isCombo ? 'is-combo' : ''}">
                        ${isFramed && bgSrc ? `
                        <div class="nd-card-bg-frame">
                            <img src="${bgSrc}" ${bgSrcSet ? `srcset="${bgSrcSet}" sizes="${imageSizes}"` : ''} alt="${hamburguesa.name}" class="nd-card-bg-image" loading="${imageLoading}"${imagePriority} decoding="async">
                        </div>
                        ` : ''}
                        <h2 class="nd-card-title">${hamburguesa.name}</h2>
                        ${stickerSrc ? `
                        <img src="${stickerSrc}" ${stickerSrcSet ? `srcset="${stickerSrcSet}" sizes="${imageSizes}"` : ''} alt="${hamburguesa.name}" class="nd-card-image ${hamburguesa.id === 109 || (hamburguesa.name && hamburguesa.name.toUpperCase().includes('PAPAS')) ? 'img-papas' : ''}" loading="${imageLoading}"${imagePriority} decoding="async">
                        ` : ''}
                        ${hasIngredients ? `<p class="nd-card-ingredients">${readableIngredients}</p>` : ''}
                    </div>
                    <div class="nd-card-footer">
                        ${hamburguesa.variants.map((variant, vIndex) => `
                            <div class="nd-price-box ${vIndex === window.selectedBurgerVariants[hamburguesa.id] ? 'active' : ''} variant-pill" 
                                 data-sanguche-id="${hamburguesa.id}" 
                                 data-variant-index="${vIndex}"
                                 data-price="${variant.price}"
                                 onclick="handleVariantVisualClick(this, ${hamburguesa.id}, ${vIndex})">
                                <span class="nd-price-label">${variant.type}</span>
                                <span class="nd-price-amount">$${formatPrice(variant.price)}</span>
                            </div>
                        `).join('')}
                    </div>

                    <!-- OPCIÓN VEGGIE -->
                    ${hamburguesa.id !== 109 ? `
                    <div class="nd-veggie-pills">
                        <label class="veggie-toggle-container" style="transform: scale(0.9);">
                            <span class="veggie-label">OPCIÓN VEGGIE</span>
                            <input type="checkbox" class="veggie-checkbox" id="veggie-check-${hamburguesa.id}" onchange="handleVeggieToggle(${hamburguesa.id})">
                            <div class="veggie-switch"></div>
                        </label>
                    </div>
                    ` : ''}

                    <button id="add-btn-${hamburguesa.id}" class="nd-order-btn" data-product-id="${hamburguesa.id}" onclick="handleAddToCartClick(${hamburguesa.id})">
                        AGREGAR AL PEDIDO
                    </button>
                `;

                fragment.appendChild(card);
            });
            grid.replaceChildren(fragment);
            grid.classList.remove('is-loading');
            grid.setAttribute('aria-busy', 'false');
            observeFadeElements(grid);
            console.log('Render de hamburguesas finalizado.');
        }

        // --- Manejo Visual y de Datos de las variantes ---
        function handleVariantVisualClick(element, burgerId, variantIndex) {
            console.log('Cambio de variante:', burgerId, 'Índice:', variantIndex);
            // Guardar en el objeto global
            window.selectedBurgerVariants[burgerId] = variantIndex;

            // Visual: Remover active de los otros de la misma tarjeta
            document.querySelectorAll(`.nd-price-box[data-sanguche-id="${burgerId}"]`).forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }

        // --- Manejo del Click en Agregar al Carrito ---
        function handleAddToCartClick(productId) {
            console.log('Agregando al carrito ID:', productId);
            const product = hamburguesas.find(p => p.id === productId);
            if (!product) {
                console.error('Producto no encontrado:', productId);
                return;
            }

            const variantIndex = window.selectedBurgerVariants[productId] || 0;
            const variant = product.variants[variantIndex];

            const veggieCheck = document.getElementById(`veggie-check-${productId}`);
            const isVeggie = veggieCheck ? veggieCheck.checked : false;

            console.log('Variante seleccionada:', variant.type, 'Veggie:', isVeggie);

            if (product && variant && typeof cart !== 'undefined') {
                cart.addToCart(product, variant, isVeggie);

                // Feedback visual en el botón
                const btn = document.getElementById(`add-btn-${productId}`);
                btn.innerHTML = '¡AGREGADO!';

                setTimeout(() => {
                    btn.innerHTML = 'AGREGAR AL PEDIDO';
                }, 1000); // 1 segundo exacto
            } else {
                console.error('Error: cart no definido o datos insuficientes');
            }
        }

        // --- Manejar click en variante ---
        function handleVariantClick(e) {
            const button = e.currentTarget;
            const sangucheId = button.dataset.sangucheId;
            const price = parseInt(button.dataset.price);

            // Remover active de todos los pills del mismo sanguche
            document.querySelectorAll(`[data-sanguche-id="${sangucheId}"]`).forEach(btn => {
                btn.classList.remove('active');
            });

            // Agregar active al pill clickeado
            button.classList.add('active');

            // Actualizar precio
            const priceDisplay = document.querySelector(`[data-price-display="${sangucheId}"]`);
            priceDisplay.style.transform = 'scale(1.1)';
            priceDisplay.textContent = formatPrice(price);

            setTimeout(() => {
                priceDisplay.style.transform = 'scale(1)';
            }, 200);
        }

        // --- Renderizar Bebidas ---
        function renderBebidas() {
            const grid = document.getElementById('bebidas-grid');
            const fragment = document.createDocumentFragment();

            if (bebidas.length === 0) {
                // No hay bebidas en Sanity — la sección queda oculta
                grid.replaceChildren();
                return;
            }

            // Mostrar la sección solo si hay bebidas
            const section = document.getElementById('bebidas-section');
            if (section) section.style.display = '';

            bebidas.forEach((bebida, index) => {
                const card = document.createElement('article');
                card.className = 'post-card'; // Sin fade-in-up para asegurar visibilidad
                const imageSrcSet = buildSanitySrcSet(bebida.image, [320, 480, 640, 800]);

                card.innerHTML = `
                    <div class="post-header">
                        <div class="avatar-circle"></div>
                        <span class="post-username">panzo.ar</span>
                    </div>
                    <div class="post-img-container">
                        ${bebida.badge ? `<div class="badge-new">${bebida.badge}</div>` : ''}
                        <img src="${bebida.image}" ${imageSrcSet ? `srcset="${imageSrcSet}" sizes="(max-width: 768px) calc(100vw - 40px), 400px"` : ''} alt="${bebida.name}" class="post-img" style="height: 100%; object-fit: cover;" loading="lazy" decoding="async">
                    </div>
                    <div class="post-footer">
                        <div class="post-actions">
                            <i class="ph-fill ph-heart" style="color: var(--color-brand)"></i>
                        </div>
                        <p class="post-caption">
                            <span style="font-weight: 900;">${bebida.name}.</span>
                            ${bebida.description}
                        </p>
                        <div class="price-display" style="margin-top: var(--space-4);">$${formatPrice(bebida.price)}</div>
                        <button 
                            class="btn btn-outline add-to-cart-btn" 
                            data-product-id="${bebida.id}"
                            data-product-type="bebida"
                            style="width: 100%; margin-top: var(--space-4); font-size: 1rem; padding: 10px;"
                        >
                            <i class="ph-bold ph-shopping-cart"></i> AGREGAR AL PEDIDO
                        </button>
                    </div>
                    `;

                fragment.appendChild(card);
            });
            grid.replaceChildren(fragment);
        }

        // --- Renderizar Sanguches (vacío, mantenido por compatibilidad) ---
        function renderSanguches() { /* sin sanguches regulares */ }

        // --- Inicializar ---
        document.addEventListener('DOMContentLoaded', async () => {
            // La red ya está en curso desde que el parser alcanzó este script.
            await menuRequest;

            renderHamburguesas();
            renderSanguches();
            renderBebidas();

            console.log('Productos renderizados:', document.querySelectorAll('.post-card').length);
            connectCartButtons();
        });

        // --- Animaciones de Scroll ---

        // 1. Header
        const header = document.getElementById('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        const mantel = document.getElementById('mantel-bg');
        const sectionsWithMantel = document.querySelectorAll('.has-mantel');

        // Entradas suaves sin alterar la geometría: opacity/transform no generan CLS.
        const fadeObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const element = entry.target;
                const finishAnimation = () => {
                    element.classList.remove('fade-in-up', 'visible');
                    element.style.removeProperty('transition-delay');
                };

                element.classList.add('visible');
                fadeObserver.unobserve(element);

                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    finishAnimation();
                } else {
                    element.addEventListener('transitionend', finishAnimation, { once: true });
                }
            });
        }, {
            threshold: 0.08,
            rootMargin: '0px 0px -24px 0px'
        });

        function observeFadeElements(root = document) {
            root.querySelectorAll('.fade-in-up:not(.visible)').forEach(element => {
                fadeObserver.observe(element);
            });
        }

        // Observer especial para el mantel
        const mantelObserver = new IntersectionObserver((entries) => {
            let anyVisible = false;
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    anyVisible = true;
                }
            });

            if (anyVisible) {
                mantel.classList.add('visible');
            } else {
                // Solo quitar si ninguna sección con mantel está visible
                const currentVisible = Array.from(sectionsWithMantel).some(s => {
                    const rect = s.getBoundingClientRect();
                    return rect.top < window.innerHeight && rect.bottom > 0;
                });
                if (!currentVisible) mantel.classList.remove('visible');
            }
        }, { threshold: 0.01 });

        observeFadeElements();
        sectionsWithMantel.forEach(section => mantelObserver.observe(section));

        // Parallax del mantel desactivado (el fondo permanece fijo)

        // --- Manejo del Toggle Veggie ---
        function handleVeggieToggle(productId) {
            console.log('Veggie toggle ID:', productId);
            const checkbox = document.getElementById(`veggie-check-${productId}`);
            const btn = document.getElementById(`add-btn-${productId}`);
            const container = checkbox.closest('.veggie-toggle-container');

            if (checkbox && checkbox.checked) {
                console.log('Veggie activado');
                btn.classList.add('veggie-active');
                container.classList.add('active');
            } else if (checkbox) {
                console.log('Veggie desactivado');
                btn.classList.remove('veggie-active');
                container.classList.remove('active');
            }
        }
    </script>

</body>
